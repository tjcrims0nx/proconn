[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switch2mod"
version = "0.0.1"
description = "ProConn Switch 2 Pro Controller to XInput link for PC"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5.0", "hidapi>=0.14.0", "pyusb>=1.2.1", "libusb>=1.0.27"]

[project.scripts]
switch2mod = "switch2mod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"switch2mod._vendor.vgamepad.win" = ["vigem/**/*"]
"switch2mod._vendor.vgamepad.lin" = ["*.py"]
