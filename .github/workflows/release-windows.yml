name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Test
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q

      - name: Build EXE
        run: >-
          pyinstaller --noconfirm --clean --windowed --name Switch2ProMod
          --paths src --collect-all pygame
          --exclude-module vgamepad
          --add-data "src/switch2mod/_vendor;switch2mod/_vendor"
          --add-data "cod_profile.json;." --add-data "destiny2_profile.json;."
          app.py

      - name: Build installer EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Switch2ProModSetup
          --add-data "dist/Switch2ProMod;payload"
          installer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switch2ProMod-windows
          path: dist/Switch2ProModSetup.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Switch2ProModSetup.exe
