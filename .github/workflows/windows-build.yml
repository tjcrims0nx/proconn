name: Windows Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        timeout-minutes: 12
        run: |
          python -m pip install --upgrade pip setuptools>=68 wheel
          echo "--- requirements ---"
          pip install -r requirements.txt --progress-bar off
          echo "--- editable package (no build isolation) ---"
          pip install -e . --no-build-isolation --progress-bar off
          echo "--- test/build tools ---"
          pip install pytest pyinstaller --progress-bar off
          echo "--- installed ---"
          pip freeze | findstr /i "pygame-ce vgamepad hidapi pyusb libusb pytest pyinstaller"

      - name: Run tests
        timeout-minutes: 10
        run: |
          python -m pytest tests/ -q

      - name: Build Windows EXE (PyInstaller)
        run: |
          pyinstaller --onefile --windowed ^
            --name "ProConn" ^
            --icon assets/proconn.ico ^
            --exclude-module vgamepad ^
            --add-data "assets;assets" ^
            --add-data "cod_profile.json;." ^
            --add-data "destiny2_profile.json;." ^
            --add-data "src/switch2mod/_vendor;switch2mod/_vendor" ^
            --hidden-import switch2mod.cli ^
            --hidden-import switch2mod.gui ^
            --hidden-import switch2mod.mapper ^
            --hidden-import switch2mod.hid_mapper ^
            --hidden-import switch2mod.hid_reader ^
            --hidden-import switch2mod.crosshair ^
            --hidden-import switch2mod.detection ^
            --hidden-import switch2mod.config ^
            --hidden-import switch2mod.sticks ^
            --hidden-import switch2mod.rear ^
            --hidden-import switch2mod.logging_setup ^
            --hidden-import hid ^
            app.py
        shell: cmd

      - name: Build Console EXE (no --windowed, for debugging)
        run: |
          pyinstaller --onefile ^
            --name "ProConn-console" ^
            --icon assets/proconn.ico ^
            --exclude-module vgamepad ^
            --add-data "assets;assets" ^
            --add-data "cod_profile.json;." ^
            --add-data "destiny2_profile.json;." ^
            --add-data "src/switch2mod/_vendor;switch2mod/_vendor" ^
            --hidden-import switch2mod.cli ^
            --hidden-import switch2mod.gui ^
            --hidden-import switch2mod.mapper ^
            --hidden-import switch2mod.hid_mapper ^
            --hidden-import switch2mod.hid_reader ^
            --hidden-import switch2mod.crosshair ^
            --hidden-import switch2mod.detection ^
            --hidden-import switch2mod.config ^
            --hidden-import switch2mod.sticks ^
            --hidden-import switch2mod.rear ^
            --hidden-import switch2mod.logging_setup ^
            --hidden-import hid ^
            app.py
        shell: cmd

      - name: Verify build
        run: |
          dir dist\
          dist\ProConn-console.exe --selftest || echo "selftest reported issues"
          dist\ProConn-console.exe --list || echo "No controller connected (expected in CI)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProConn-Windows-x64
          path: |
            dist/ProConn.exe
            dist/ProConn-console.exe
            cod_profile.json
            destiny2_profile.json
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
           name: ProConn-Windows-x64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ProConn.exe
            release/ProConn-console.exe
            release/cod_profile.json
            release/destiny2_profile.json
          generate_release_notes: true
          draft: false
          prerelease: false
