name: Windows Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short || echo "Tests completed"

      - name: Build Windows EXE (PyInstaller)
        run: |
          pyinstaller --onefile --windowed ^
            --name "Switch2ProMod" ^
            --icon NONE ^
            --add-data "cod_profile.json;." ^
            --add-data "destiny2_profile.json;." ^
            --hidden-import switch2mod.cli ^
            --hidden-import switch2mod.gui ^
            --hidden-import switch2mod.mapper ^
            --hidden-import switch2mod.hid_mapper ^
            --hidden-import switch2mod.hid_reader ^
            --hidden-import switch2mod.crosshair ^
            --hidden-import switch2mod.detection ^
            --hidden-import switch2mod.config ^
            --hidden-import switch2mod.sticks ^
            --hidden-import switch2mod.rear ^
            --hidden-import switch2mod.logging_setup ^
            --hidden-import vgamepad ^
            --hidden-import hid ^
            --collect-all vgamepad ^
            app.py
        shell: cmd

      - name: Build Console EXE (no --windowed, for debugging)
        run: |
          pyinstaller --onefile ^
            --name "Switch2ProMod-console" ^
            --icon NONE ^
            --add-data "cod_profile.json;." ^
            --add-data "destiny2_profile.json;." ^
            --hidden-import switch2mod.cli ^
            --hidden-import switch2mod.gui ^
            --hidden-import switch2mod.mapper ^
            --hidden-import switch2mod.hid_mapper ^
            --hidden-import switch2mod.hid_reader ^
            --hidden-import switch2mod.crosshair ^
            --hidden-import switch2mod.detection ^
            --hidden-import switch2mod.config ^
            --hidden-import switch2mod.sticks ^
            --hidden-import switch2mod.rear ^
            --hidden-import switch2mod.logging_setup ^
            --hidden-import vgamepad ^
            --hidden-import hid ^
            --collect-all vgamepad ^
            app.py
        shell: cmd

      - name: Verify build
        run: |
          dir dist\
          dist\Switch2ProMod-console.exe --list || echo "No controller connected (expected in CI)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Switch2ProMod-Windows-x64
          path: |
            dist/Switch2ProMod.exe
            dist/Switch2ProMod-console.exe
            cod_profile.json
            destiny2_profile.json
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Switch2ProMod-Windows-x64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Switch2ProMod.exe
            release/Switch2ProMod-console.exe
            release/cod_profile.json
            release/destiny2_profile.json
          generate_release_notes: true
          draft: false
          prerelease: false
